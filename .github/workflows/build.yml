name: Build RulszMusic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Fixed Keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: app/fixed-debug.jks
          key: convx-fixed-signing-key-v1

      - name: Generate Fixed Keystore (Jika Belum Ada di Cache)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore app/fixed-debug.jks \
            -alias convxkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=RulszMusic, OU=Dev, O=Rulsz, L=ID, ST=ID, C=ID"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RulszMusic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
